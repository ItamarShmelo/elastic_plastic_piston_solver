[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elastic-plastic-piston-solver"
version = "0.1.0"
description = "Analytic Riemann solver for the elastic-plastic piston problem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.7",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "scipy-stubs>=1.17.0.2",
]

[tool.hatch.build.targets.wheel]
only-include = ["elastoplastic_piston_solver.py"]
